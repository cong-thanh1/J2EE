<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Danh sách Sản phẩm</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <h2 class="mb-4">
                <i class="bi bi-list-ul"></i> Danh sách Sản phẩm
            </h2>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search Result Info -->
            <div th:if="${keyword}" class="alert alert-info">
                <i class="bi bi-search"></i> Kết quả tìm kiếm cho: <strong th:text="${keyword}"></strong>
                <a th:href="@{/products}" class="btn btn-sm btn-outline-primary ms-2">
                    <i class="bi bi-x-circle"></i> Xóa bộ lọc
                </a>
            </div>

            <!-- Products Table -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${products != null && !products.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-primary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Hình ảnh</th>
                                        <th>Tên sản phẩm</th>
                                        <th>Giá</th>
                                        <th>Danh mục</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product : ${listproduct != null ? listproduct : products}">
                                        <td th:text="${product.id}"></td>
                                        <td>
                                            <img th:if="${product.image != null && !product.image.isEmpty()}" 
                                                 th:src="@{'/images/' + ${product.image}}" 
                                                 alt="Product Image" 
                                                 class="img-thumbnail" 
                                                 style="width: 80px; height: 80px; object-fit: cover;">
                                            <span th:if="${product.image == null || product.image.isEmpty()}" 
                                                  class="text-muted">
                                                <i class="bi bi-image"></i> Không có ảnh
                                            </span>
                                        </td>
                                        <td th:text="${product.name}"></td>
                                        <td>
                                            <span class="text-success fw-bold">
                                                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span> đ
                                            </span>
                                        </td>
                                        <td>
                                            <span class="badge bg-info" th:text="${product.category.name}"></span>
                                        </td>
                                        <td>
                                            <a th:href="@{'/products/edit/' + ${product.id}}" 
                                               class="btn btn-sm btn-warning me-1">
                                                <i class="bi bi-pencil"></i> Sửa
                                            </a>
                                            <a th:href="@{'/products/delete/' + ${product.id}}" 
                                               class="btn btn-sm btn-danger"
                                               onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')">
                                                <i class="bi bi-trash"></i> Xóa
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div th:if="${products == null || products.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 3rem; color: #ccc;"></i>
                        <p class="text-muted mt-3">Chưa có sản phẩm nào. 
                            <a th:href="@{/products/create}">Thêm sản phẩm đầu tiên</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
