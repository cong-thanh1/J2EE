<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa thông tin sách</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }
        .btn {
            padding: 10px 20px;
            text-decoration: none;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: inline-block;
        }
        .btn-submit {
            background-color: #2196F3;
            color: white;
        }
        .btn-cancel {
            background-color: #999;
            color: white;
            margin-left: 10px;
        }
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sửa thông tin sách</h1>
        
        <form th:action="@{/books/edit}" method="post" th:object="${book}">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Tên sách:</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label>Tác giả:</label>
                <input type="text" th:field="*{author}" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-submit">Cập nhật</button>
                <a href="/books" class="btn btn-cancel">Hủy</a>
            </div>
        </form>
    </div>
</body>
</html>
